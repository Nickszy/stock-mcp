# Stock-MCP Docker Compose Deployment
# Production-ready containerized deployment

services:
  # ==================== Stock MCP Server ====================
  stock-mcp:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: stock-mcp:latest
    container_name: stock-mcp
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-9898}:8000"
    environment:
      # Server
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      CORS_ORIGINS: "*"
      # Redis (use service name)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # PostgreSQL (use service name)
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-stockmcp123}@postgres:5432/${POSTGRES_DB:-stockmcp}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockmcp123}
      POSTGRES_DB: ${POSTGRES_DB:-stockmcp}
      # Security Master
      SECURITY_MASTER_BACKEND: auto
      # Data Sources
      TUSHARE_ENABLED: ${TUSHARE_ENABLED:-False}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      TUSHARE_HTTP_URL: ${TUSHARE_HTTP_URL:-}
      FINNHUB_ENABLED: ${FINNHUB_ENABLED:-False}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      BAOSTOCK_ENABLED: ${BAOSTOCK_ENABLED:-True}
      # Proxy
      PROXY_ENABLED: ${PROXY_ENABLED:-False}
      PROXY_HOST: ${PROXY_HOST:-}
      PROXY_PORT: ${PROXY_PORT:-}
      # Timeouts
      MCP_TOOL_TIMEOUT_SECONDS: "35"
      PROVIDER_CALL_TIMEOUT_SECONDS: "12"
      HTTP_REQUEST_TIMEOUT_SECONDS: "20"
      # API Keys
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - stock-mcp-logs:/app/logs
      - stock-mcp-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - stock-mcp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==================== Redis Cache ====================
  redis:
    image: redis:7-alpine
    container_name: stock-mcp-redis
    restart: unless-stopped
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - stock-mcp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== PostgreSQL Database ====================
  postgres:
    image: postgres:15-alpine
    container_name: stock-mcp-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockmcp123}
      POSTGRES_DB: ${POSTGRES_DB:-stockmcp}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - stock-mcp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-stockmcp}"]
      interval: 10s
      timeout: 5s
      retries: 5

# ==================== Networks ====================
networks:
  stock-mcp-network:
    driver: bridge
    name: stock-mcp-network

# ==================== Volumes ====================
volumes:
  stock-mcp-logs:
    name: stock-mcp-logs
  stock-mcp-data:
    name: stock-mcp-data
  redis-data:
    name: stock-mcp-redis-data
  postgres-data:
    name: stock-mcp-postgres-data
